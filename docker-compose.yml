  #     - mongodb_data:/data/db
  #   environment:
  #     - MONGO_INITDB_DATABASE=email_webhook_service

  send-jer:
    build: .
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=email_webhook_service
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DEFAULT_SMTP_HOST=${DEFAULT_SMTP_HOST}
      - DEFAULT_SMTP_PORT=${DEFAULT_SMTP_PORT}
      - DEFAULT_SMTP_USER=${DEFAULT_SMTP_USER}
      - DEFAULT_SMTP_PASS=${DEFAULT_SMTP_PASS}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - DEFAULT_USE_TLS=${DEFAULT_USE_TLS}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - CLEANUP_CRON_SCHEDULE=${CLEANUP_CRON_SCHEDULE:-0 0 * * *}

